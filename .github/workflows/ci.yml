name: CI

on:
  push:
    branches: [main, "v*"]
  pull_request:

permissions:
  contents: read

# A newer push to the same ref supersedes the run still in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SECRET_KEY: ci-secret-not-for-production
      SKIP_DB_BOOTSTRAP: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.txt
      # Test/CI-only tools live in their own step so they never interfere with
      # (or get pinned by) the application's hash-locked requirements.txt.
      - run: pip install pytest pytest-xdist pytest-github-actions-annotate-failures pip-audit bandit
      - run: python -m py_compile app.py models.py worker.py
      # SQLite (the default when TEST_DATABASE_URL is unset). -n auto: every
      # xdist worker process gets its own temp SQLite file.
      - run: python -m pytest -q -n auto --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml
      - run: pip-audit -r requirements.txt
      # Whole app at medium+ severity. Accepted findings carry an inline
      # `# nosec <id> - reason` instead of a blanket skip.
      - run: bandit -r app.py admin.py auth.py worker.py blueprints services converters -ll

  # Production runs PostgreSQL: run the whole suite there too (each xdist worker
  # creates and drops its own <db>_<worker> database, see tests/conftest.py).
  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arvision
          POSTGRES_PASSWORD: arvision
          POSTGRES_DB: arvision_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arvision"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-secret-not-for-production
      SKIP_DB_BOOTSTRAP: "1"
      TEST_DATABASE_URL: postgresql+psycopg2://arvision:arvision@localhost:5432/arvision_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.txt
      - run: pip install pytest pytest-xdist pytest-github-actions-annotate-failures
      - run: python -m pytest -q -n auto --junitxml=test-results-postgres.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-postgres
          path: test-results-postgres.xml

  frontend-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SECRET_KEY: ci-secret-not-for-production
      DEBUG: "False"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: pip install --require-hashes -r requirements.txt
      - run: npm ci
      - run: npm run lint
      - run: npm run security
      # github annotations + an HTML report (CI's default reporter is just "dot").
      - run: npm run test:e2e -- --reporter=github,html
      # Traces/screenshots/HTML report make e2e failures diagnosable.
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Migrations against the production dialect: upgrade, model/schema drift
  # check, then a full downgrade/upgrade round trip.
  migration-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arvision
          POSTGRES_PASSWORD: arvision
          POSTGRES_DB: arvision_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arvision"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-secret-not-for-production
      SKIP_DB_BOOTSTRAP: "1"
      FLASK_APP: app.py
      DATABASE_URL: postgresql+psycopg2://arvision:arvision@localhost:5432/arvision_migrate
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.txt
      - run: flask db heads
      - run: flask db upgrade
      # Fails if models.py and the migrated schema differ.
      - run: flask db check
      - name: Downgrade / upgrade round trip
        run: |
          flask db downgrade base
          flask db upgrade
          flask db check

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
