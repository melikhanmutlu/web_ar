<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Protected model — arvision</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/arvision.css') }}">
</head>
<body>
    <main class="home-main" style="max-width:32rem">
        <div class="av-card av-stack">
            <h1 class="home-title">Protected model</h1>
            <p class="av-card-desc">Enter the password supplied by the model owner.</p>
            <form method="post" class="av-stack">
                <input class="av-input" type="password" name="password" required autocomplete="current-password">
                <button class="btn-primary" type="submit">Open model</button>
            </form>
        </div>
    </main>
</body>
</html>
