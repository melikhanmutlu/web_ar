{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <h2>My Models</h2>
    
    {% if models %}
    <div class="mb-3">
        <button id="deleteAllBtn" class="btn btn-danger">Delete All Models</button>
    </div>
    
    <div class="row">
        {% for model in models %}
        <div class="col-md-4 mb-4 model-card" data-model-id="{{ model.id }}">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">{{ model.filename }}</h5>
                    <p class="card-text">Uploaded: {{ model.upload_date | localdt('%Y-%m-%d %H:%M:%S') }}</p>
                    <div class="btn-group">
                        <a href="{{ url_for('viewer.view_model', model_id=model.id) }}" class="btn btn-primary">View</a>
                        <button class="btn btn-danger delete-model">Delete</button>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <p>No models uploaded yet.</p>
    {% endif %}
</div>

<script src="{{ url_for('static', filename='js/models_page.js') }}"></script>

<style>
.card {
    height: 100%;
    transition: transform 0.2s;
}
.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}
.btn-group {
    display: flex;
    gap: 0.5rem;
}
</style>
{% endblock %}
