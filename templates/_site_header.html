<header class="top-header">
    <div class="brand-shell">
        <a href="{{ url_for('main.index') }}" class="brand-mark">arvision</a>
    </div>
    <nav class="top-actions" aria-label="Primary">
        <a href="{{ url_for('main.index') }}" class="showcase-nav-link {% if request.endpoint == 'main.index' %}is-active{% endif %}">{{ _('home') }}</a>
        <a href="{{ url_for('discover.discover') }}" class="showcase-nav-link {% if request.endpoint == 'discover.discover' %}is-active{% endif %}">{{ _('discover') }}</a>
        {% if current_user.is_authenticated %}
        <a href="{{ url_for('models_crud.my_models') }}" class="showcase-nav-link {% if request.endpoint == 'models_crud.my_models' %}is-active{% endif %}">{{ _('my models') }}</a>
        {% if current_user.is_admin %}
        <a href="{{ url_for('admin.dashboard') }}" class="showcase-nav-link {% if request.endpoint and request.endpoint.startswith('admin.') %}is-active{% endif %}">{{ _('admin') }}</a>
        {% endif %}
        <form method="POST" action="{{ url_for('auth.logout') }}" class="logout-form" style="display:inline;">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="showcase-nav-link" style="background:none;border:none;cursor:pointer;font-family:inherit;">{{ _('log out') }}</button>
        </form>
        {% else %}
        <a href="{{ url_for('auth.register', next=request.path) }}" class="showcase-nav-link {% if request.endpoint == 'auth.register' %}is-active{% endif %}">{{ _('register') }}</a>
        <a href="{{ url_for('auth.login', next=request.path) }}" class="showcase-nav-link login-pill {% if request.endpoint == 'auth.login' %}is-active{% endif %}">{{ _('login') }}</a>
        {% endif %}
        <a href="{{ url_for('main.set_language', lang='tr' if get_locale() == 'en' else 'en') }}" class="showcase-nav-link lang-switch" title="{{ _('Switch language') }}">{{ 'TR' if get_locale() == 'en' else 'EN' }}</a>
    </nav>
</header>
