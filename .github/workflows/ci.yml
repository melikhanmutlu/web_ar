name: CI

on:
  push:
    branches: [v32, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-not-for-production
      SKIP_DB_BOOTSTRAP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pip-audit
      - run: python -m py_compile app.py models.py worker.py
      - run: python -m pytest -q
      - run: pip-audit -r requirements.txt

  migration-check:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-not-for-production
      SKIP_DB_BOOTSTRAP: "1"
      FLASK_APP: app.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: flask db heads
      - run: flask db upgrade

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
