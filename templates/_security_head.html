<meta name="csrf-token" content="{{ csrf_token() }}">
<style>
    /* Skip link (self-contained: view.html/studio don't all load arvision.css). */
    .skip-link { position: fixed; left: 12px; top: 8px; z-index: 100000; padding: 10px 16px;
        background: #111318; color: #fff; border-radius: 8px; font: 600 14px/1.2 Arial, Helvetica, sans-serif;
        text-decoration: none; transform: translateY(-200%); }
    .skip-link:focus { transform: none; outline: 2px solid #8d8aff; outline-offset: 2px; }
</style>
<script>
    // Escape untrusted strings before they go into innerHTML. Available
    // app-wide so server-authored values (hotspot labels, view names, version
    // comments) can't inject markup/script.
    window.escapeHtml = function (value) {
        if (value === null || value === undefined) return '';
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    };
    // Small shared UI helpers (self-contained styles: view.html doesn't load
    // arvision.css). arToast(msg, type, {actionLabel, onAction}) shows a
    // transient toast; withBusy(btn, fn) disables a button while an async
    // action runs so a double-click can't fire it twice.
    window.arToast = function (message, type, opts) {
        opts = opts || {};
        var t = document.createElement('div');
        t.className = 'ar-toast ar-toast--' + (type || 'info');
        t.setAttribute('role', type === 'error' ? 'alert' : 'status');
        t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99998;' +
            'max-width:90vw;display:flex;gap:12px;align-items:center;padding:10px 16px;border-radius:10px;' +
            'font-size:14px;line-height:1.4;box-shadow:0 10px 30px rgba(0,0,0,.3);color:#fff;' +
            'background:' + (type === 'error' ? '#b91c1c' : '#111827') + ';';
        var span = document.createElement('span');
        span.textContent = message;
        t.appendChild(span);
        if (opts.actionLabel && typeof opts.onAction === 'function') {
            var b = document.createElement('button');
            b.type = 'button';
            b.textContent = opts.actionLabel;
            b.style.cssText = 'background:rgba(255,255,255,.18);border:0;color:#fff;padding:3px 10px;border-radius:6px;cursor:pointer;font-weight:600;';
            b.addEventListener('click', function () { t.remove(); opts.onAction(); });
            t.appendChild(b);
        }
        document.body.appendChild(t);
        setTimeout(function () { t.remove(); }, opts.duration || (opts.actionLabel ? 8000 : 4000));
        return t;
    };
    // arConfirm(message, {confirmLabel, cancelLabel, danger}) -> Promise<boolean>
    // arPrompt(message, {defaultValue, label, confirmLabel, cancelLabel, placeholder, maxLength})
    //   -> Promise<string|null>   (null = cancelled)
    // Accessible replacements for window.confirm/prompt: role=dialog +
    // aria-modal, focus trapped inside and restored on close, Esc cancels,
    // Enter confirms, backdrop click cancels. Destructive confirms pass
    // {danger:true}: red confirm button and initial focus on Cancel.
    var _dlgSeq = 0;
    function arDialog(kind, message, opts) {
        opts = opts || {};
        return new Promise(function (resolve) {
            var id = 'arDlg' + (++_dlgSeq);
            var prevFocus = document.activeElement;
            var overlay = document.createElement('div');
            overlay.className = 'ar-dialog-overlay';
            overlay.style.cssText = 'position:fixed;inset:0;z-index:100001;display:flex;align-items:center;' +
                'justify-content:center;padding:16px;background:rgba(17,19,24,.55);';
            var box = document.createElement('div');
            box.className = 'ar-dialog' + (opts.danger ? ' ar-dialog--danger' : '');
            box.setAttribute('role', opts.danger ? 'alertdialog' : 'dialog');
            box.setAttribute('aria-modal', 'true');
            box.setAttribute('aria-labelledby', id + 'm');
            box.style.cssText = 'width:min(100%,420px);background:#fff;color:#111318;border-radius:14px;' +
                'padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.35);font:14px/1.5 Arial,Helvetica,sans-serif;';
            var msg = document.createElement('p');
            msg.id = id + 'm';
            msg.style.cssText = 'margin:0 0 14px;font-size:15px;font-weight:600;white-space:pre-line;';
            msg.textContent = message;
            box.appendChild(msg);
            var input = null;
            if (kind === 'prompt') {
                input = document.createElement('input');
                input.type = 'text';
                input.id = id + 'i';
                input.className = 'ar-dialog-input';
                input.value = opts.defaultValue == null ? '' : String(opts.defaultValue);
                if (opts.placeholder) input.placeholder = opts.placeholder;
                if (opts.maxLength) input.maxLength = opts.maxLength;
                if (opts.label) {
                    var lab = document.createElement('label');
                    lab.htmlFor = input.id;
                    lab.textContent = opts.label;
                    lab.style.cssText = 'display:block;margin:0 0 6px;font-size:12px;color:#5b6370;';
                    box.appendChild(lab);
                } else {
                    input.setAttribute('aria-labelledby', id + 'm');
                }
                input.style.cssText = 'width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid #c4c9d1;' +
                    'border-radius:8px;font:inherit;margin-bottom:16px;color:#111318;background:#fff;';
                box.appendChild(input);
            }
            var row = document.createElement('div');
            row.style.cssText = 'display:flex;justify-content:flex-end;gap:8px;';
            var btnCss = 'min-height:40px;padding:8px 16px;border-radius:9px;font:600 14px Arial,Helvetica,sans-serif;cursor:pointer;';
            var cancel = document.createElement('button');
            cancel.type = 'button';
            cancel.setAttribute('data-ar-dialog-cancel', '');
            cancel.textContent = opts.cancelLabel || 'Cancel';
            cancel.style.cssText = btnCss + 'background:#fff;color:#111318;border:1px solid #c4c9d1;';
            var ok = document.createElement('button');
            ok.type = 'button';
            ok.setAttribute('data-ar-dialog-confirm', '');
            ok.textContent = opts.confirmLabel || (kind === 'prompt' ? 'Save' : (opts.danger ? 'Delete' : 'OK'));
            ok.style.cssText = btnCss + 'color:#fff;border:1px solid transparent;background:' + (opts.danger ? '#b91c1c' : '#111318') + ';';
            row.appendChild(cancel);
            row.appendChild(ok);
            box.appendChild(row);
            overlay.appendChild(box);

            var done = false;
            function close(value) {
                if (done) return;
                done = true;
                document.removeEventListener('keydown', onKey, true);
                overlay.remove();
                try { if (prevFocus && prevFocus.focus) prevFocus.focus(); } catch (e) {}
                resolve(value);
            }
            function accept() { close(kind === 'prompt' ? input.value : true); }
            function dismiss() { close(kind === 'prompt' ? null : false); }
            function onKey(e) {
                if (!overlay.contains(document.activeElement)) {
                    // Focus escaped to the page behind: pull it back, swallow the key.
                    e.stopPropagation();
                    if (e.key === 'Escape') { e.preventDefault(); dismiss(); }
                    else (input || ok).focus();
                    return;
                }
                if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); dismiss(); }
                else if (e.key === 'Enter') {
                    if (e.target && e.target.tagName === 'BUTTON') return; // native click on the focused button
                    e.preventDefault(); e.stopPropagation(); accept();
                } else if (e.key === 'Tab') {
                    var f = Array.prototype.slice.call(box.querySelectorAll('input,button'));
                    var first = f[0], last = f[f.length - 1];
                    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
                    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
                } else if (!(e.target && e.target.tagName === 'INPUT')) {
                    e.stopPropagation(); // keep page shortcuts from firing underneath
                }
            }
            cancel.addEventListener('click', dismiss);
            ok.addEventListener('click', accept);
            overlay.addEventListener('mousedown', function (e) { if (e.target === overlay) dismiss(); });
            document.addEventListener('keydown', onKey, true);
            document.body.appendChild(overlay);
            // Destructive confirms start on Cancel so a stray Enter can't delete.
            var initial = input || (opts.danger ? cancel : ok);
            initial.focus();
            if (input) input.select();
        });
    }
    window.arConfirm = function (message, opts) { return arDialog('confirm', message, opts); };
    window.arPrompt = function (message, opts) { return arDialog('prompt', message, opts); };
    window.withBusy = async function (btn, fn, busyText) {
        if (btn && btn.disabled) return;
        var label = btn ? btn.textContent : '';
        if (btn) { btn.disabled = true; if (busyText) btn.textContent = busyText; }
        try { return await fn(); }
        finally { if (btn) { btn.disabled = false; if (busyText) btn.textContent = label; } }
    };
    // Attach the CSRF token to every same-origin state-changing fetch so
    // existing fetch() calls across the app stay protected without edits.
    // The same wrapper watches failed JSON responses for the backend's
    // standard `upgrade` hint (services/upgrade.py) and shows one dismissible
    // upgrade CTA — a single integration point for every plan-limit paywall.
    (function () {
        var meta = document.querySelector('meta[name="csrf-token"]');
        var token = meta ? meta.getAttribute('content') : '';
        var _fetch = window.fetch.bind(window);
        var lastPromptAt = 0;
        function showUpgradePrompt(upgrade) {
            if (!upgrade || typeof upgrade.url !== 'string' || upgrade.url.indexOf('/pricing') !== 0) return;
            if (Date.now() - lastPromptAt < 60000 || document.getElementById('upgradePromptCard')) return;
            lastPromptAt = Date.now();
            var card = document.createElement('div');
            card.id = 'upgradePromptCard';
            card.setAttribute('role', 'status');
            card.style.cssText = 'position:fixed;right:16px;bottom:16px;z-index:99999;max-width:320px;' +
                'background:#111827;color:#f9fafb;border-radius:12px;padding:14px 16px;' +
                'box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:14px;line-height:1.5;';
            var text = document.createElement('div');
            text.textContent = "You've hit a limit of your current plan.";
            var link = document.createElement('a');
            link.href = upgrade.url;
            link.textContent = 'See plans →';
            link.style.cssText = 'display:inline-block;margin-top:8px;background:#4f46e5;color:#fff;' +
                'padding:6px 14px;border-radius:8px;text-decoration:none;font-weight:600;';
            var close = document.createElement('button');
            close.type = 'button';
            close.textContent = '×';
            close.setAttribute('aria-label', 'Dismiss');
            close.style.cssText = 'position:absolute;top:4px;right:8px;background:none;border:none;' +
                'color:#9ca3af;font-size:18px;cursor:pointer;';
            close.addEventListener('click', function () { card.remove(); });
            card.appendChild(close);
            card.appendChild(text);
            card.appendChild(link);
            document.body.appendChild(card);
        }
        window.fetch = function (input, init) {
            init = init || {};
            var method = (init.method || (typeof input !== 'string' && input && input.method) || 'GET').toUpperCase();
            var url = typeof input === 'string' ? input : (input && input.url) || '';
            var sameOrigin = !/^https?:\/\//i.test(url) || url.indexOf(window.location.origin) === 0;
            if (token && sameOrigin && ['POST', 'PUT', 'PATCH', 'DELETE'].indexOf(method) !== -1) {
                var headers = new Headers(init.headers || (typeof input !== 'string' && input ? input.headers : undefined) || {});
                if (!headers.has('X-CSRFToken')) headers.set('X-CSRFToken', token);
                init.headers = headers;
            }
            return _fetch(input, init).then(function (response) {
                if (sameOrigin && !response.ok &&
                    (response.headers.get('content-type') || '').indexOf('application/json') !== -1) {
                    // Read a clone so the caller's own response.json() still works.
                    response.clone().json().then(function (body) {
                        if (body && body.upgrade) showUpgradePrompt(body.upgrade);
                    }).catch(function () {});
                }
                return response;
            });
        };
    })();
</script>
