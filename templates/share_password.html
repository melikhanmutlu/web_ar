<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Protected model — arvision</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/arvision.css') }}">
</head>
<body>
    <main class="home-main" style="max-width:26rem;margin:4rem auto;padding:0 1rem">
        <p class="brand" style="margin-bottom:1rem"><a href="{{ url_for('main.index') }}" class="brand">arvision</a></p>
        <div class="av-card av-stack">
            <h1 class="home-title">Protected model</h1>
            <p class="av-card-desc"><strong>{{ model_name }}</strong>{% if owner_name %} shared by {{ owner_name }}{% endif %}. Enter the password supplied by the model owner to open it.</p>
            <form method="post" class="av-stack" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label for="sharePassword" class="field-label">Password</label>
                <input id="sharePassword" class="av-input" style="width:100%" type="password" name="password" required
                       autocomplete="current-password" autofocus
                       {% if error %}aria-invalid="true" aria-describedby="sharePasswordError"{% endif %}>
                {% if error %}<p id="sharePasswordError" role="alert" style="color:#b42318;font-size:.9rem;margin:0">{{ error }}</p>{% endif %}
                <button class="btn-primary" type="submit">Open model</button>
            </form>
        </div>
    </main>
</body>
</html>
