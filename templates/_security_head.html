<meta name="csrf-token" content="{{ csrf_token() }}">
<style>
    /* Skip link (self-contained: view.html/studio don't all load arvision.css). */
    .skip-link { position: fixed; left: 12px; top: 8px; z-index: 100000; padding: 10px 16px;
        background: #111318; color: #fff; border-radius: 8px; font: 600 14px/1.2 Arial, Helvetica, sans-serif;
        text-decoration: none; transform: translateY(-200%); }
    .skip-link:focus { transform: none; outline: 2px solid #8d8aff; outline-offset: 2px; }
</style>
<script>
    // Escape untrusted strings before they go into innerHTML. Available
    // app-wide so server-authored values (hotspot labels, view names, version
    // comments) can't inject markup/script.
    window.escapeHtml = function (value) {
        if (value === null || value === undefined) return '';
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    };
    // Small shared UI helpers (self-contained styles: view.html doesn't load
    // arvision.css). arToast(msg, type, {actionLabel, onAction}) shows a
    // transient toast; withBusy(btn, fn) disables a button while an async
    // action runs so a double-click can't fire it twice.
    window.arToast = function (message, type, opts) {
        opts = opts || {};
        var t = document.createElement('div');
        t.className = 'ar-toast ar-toast--' + (type || 'info');
        t.setAttribute('role', type === 'error' ? 'alert' : 'status');
        t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99998;' +
            'max-width:90vw;display:flex;gap:12px;align-items:center;padding:10px 16px;border-radius:10px;' +
            'font-size:14px;line-height:1.4;box-shadow:0 10px 30px rgba(0,0,0,.3);color:#fff;' +
            'background:' + (type === 'error' ? '#b91c1c' : '#111827') + ';';
        var span = document.createElement('span');
        span.textContent = message;
        t.appendChild(span);
        if (opts.actionLabel && typeof opts.onAction === 'function') {
            var b = document.createElement('button');
            b.type = 'button';
            b.textContent = opts.actionLabel;
            b.style.cssText = 'background:rgba(255,255,255,.18);border:0;color:#fff;padding:3px 10px;border-radius:6px;cursor:pointer;font-weight:600;';
            b.addEventListener('click', function () { t.remove(); opts.onAction(); });
            t.appendChild(b);
        }
        document.body.appendChild(t);
        setTimeout(function () { t.remove(); }, opts.duration || (opts.actionLabel ? 8000 : 4000));
        return t;
    };
    window.withBusy = async function (btn, fn, busyText) {
        if (btn && btn.disabled) return;
        var label = btn ? btn.textContent : '';
        if (btn) { btn.disabled = true; if (busyText) btn.textContent = busyText; }
        try { return await fn(); }
        finally { if (btn) { btn.disabled = false; if (busyText) btn.textContent = label; } }
    };
    // Attach the CSRF token to every same-origin state-changing fetch so
    // existing fetch() calls across the app stay protected without edits.
    // The same wrapper watches failed JSON responses for the backend's
    // standard `upgrade` hint (services/upgrade.py) and shows one dismissible
    // upgrade CTA — a single integration point for every plan-limit paywall.
    (function () {
        var meta = document.querySelector('meta[name="csrf-token"]');
        var token = meta ? meta.getAttribute('content') : '';
        var _fetch = window.fetch.bind(window);
        var lastPromptAt = 0;
        function showUpgradePrompt(upgrade) {
            if (!upgrade || typeof upgrade.url !== 'string' || upgrade.url.indexOf('/pricing') !== 0) return;
            if (Date.now() - lastPromptAt < 60000 || document.getElementById('upgradePromptCard')) return;
            lastPromptAt = Date.now();
            var card = document.createElement('div');
            card.id = 'upgradePromptCard';
            card.setAttribute('role', 'status');
            card.style.cssText = 'position:fixed;right:16px;bottom:16px;z-index:99999;max-width:320px;' +
                'background:#111827;color:#f9fafb;border-radius:12px;padding:14px 16px;' +
                'box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:14px;line-height:1.5;';
            var text = document.createElement('div');
            text.textContent = "You've hit a limit of your current plan.";
            var link = document.createElement('a');
            link.href = upgrade.url;
            link.textContent = 'See plans →';
            link.style.cssText = 'display:inline-block;margin-top:8px;background:#4f46e5;color:#fff;' +
                'padding:6px 14px;border-radius:8px;text-decoration:none;font-weight:600;';
            var close = document.createElement('button');
            close.type = 'button';
            close.textContent = '×';
            close.setAttribute('aria-label', 'Dismiss');
            close.style.cssText = 'position:absolute;top:4px;right:8px;background:none;border:none;' +
                'color:#9ca3af;font-size:18px;cursor:pointer;';
            close.addEventListener('click', function () { card.remove(); });
            card.appendChild(close);
            card.appendChild(text);
            card.appendChild(link);
            document.body.appendChild(card);
        }
        window.fetch = function (input, init) {
            init = init || {};
            var method = (init.method || (typeof input !== 'string' && input && input.method) || 'GET').toUpperCase();
            var url = typeof input === 'string' ? input : (input && input.url) || '';
            var sameOrigin = !/^https?:\/\//i.test(url) || url.indexOf(window.location.origin) === 0;
            if (token && sameOrigin && ['POST', 'PUT', 'PATCH', 'DELETE'].indexOf(method) !== -1) {
                var headers = new Headers(init.headers || (typeof input !== 'string' && input ? input.headers : undefined) || {});
                if (!headers.has('X-CSRFToken')) headers.set('X-CSRFToken', token);
                init.headers = headers;
            }
            return _fetch(input, init).then(function (response) {
                if (sameOrigin && !response.ok &&
                    (response.headers.get('content-type') || '').indexOf('application/json') !== -1) {
                    // Read a clone so the caller's own response.json() still works.
                    response.clone().json().then(function (body) {
                        if (body && body.upgrade) showUpgradePrompt(body.upgrade);
                    }).catch(function () {});
                }
                return response;
            });
        };
    })();
</script>
