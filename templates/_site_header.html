<header class="top-header">
    <div class="brand-shell">
        <a href="{{ url_for('main.index') }}" class="brand-mark">arvision</a>
    </div>
    <nav class="top-actions" aria-label="Primary">
        <a href="{{ url_for('discover.discover') }}" class="showcase-nav-link {% if request.endpoint == 'discover.discover' %}is-active{% endif %}">discover</a>
        {% if current_user.is_authenticated %}
        <a href="{{ url_for('models_crud.my_models') }}" class="showcase-nav-link {% if request.endpoint == 'models_crud.my_models' %}is-active{% endif %}">my models</a>
        {% if current_user.plan != 'business' %}
        <a href="{{ url_for('main.pricing') }}" class="showcase-nav-link {% if request.endpoint == 'main.pricing' %}is-active{% endif %}">upgrade</a>
        {% endif %}
        {% if current_user.is_admin %}
        <a href="{{ url_for('admin.dashboard') }}" class="showcase-nav-link {% if request.endpoint and request.endpoint.startswith('admin.') %}is-active{% endif %}">admin</a>
        {% endif %}
        <form method="POST" action="{{ url_for('auth.logout') }}" class="logout-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="showcase-nav-link">log out</button>
        </form>
        {% else %}
        <a href="{{ url_for('main.pricing') }}" class="showcase-nav-link {% if request.endpoint == 'main.pricing' %}is-active{% endif %}">pricing</a>
        <a href="{{ url_for('auth.register', next=request.path) }}" class="showcase-nav-link {% if request.endpoint == 'auth.register' %}is-active{% endif %}">register</a>
        <a href="{{ url_for('auth.login', next=request.path) }}" class="showcase-nav-link {% if request.endpoint == 'auth.login' %}is-active{% endif %}">login</a>
        {% endif %}
        <a href="{{ url_for('main.studio') }}" class="nav-cta {% if request.endpoint == 'main.studio' %}is-active{% endif %}">Open Studio</a>
    </nav>
</header>
